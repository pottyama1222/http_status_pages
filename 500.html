<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 Internal Server Error</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:"Courier New", monospace;
    min-height:100vh;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:20px;
    padding:20px;
}

.left,
.right{
    padding:0;
}

.frame{
    border:4px solid #000;
    padding:25px;
    height:100%;
}

.code{
    font-size:110px;
    font-weight:bold;
    line-height:0.9;
}

.subtitle{
    font-size:24px;
    margin-bottom:20px;
}

.line{
    border-top:3px solid #000;
    margin:20px 0 30px;
}

.title{
    font-size:42px;
    line-height:1.4;
    margin-bottom:20px;
}

.desc{
    font-size:18px;
    line-height:1.8;
    margin-bottom:25px;
}

.command-title{
    font-size:20px;
    margin-bottom:10px;
}

.menu{
    border:4px solid #000;
    padding:15px 20px;
    font-size:22px;
    line-height:1.8;
}

.cursor{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.right{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:15px;
}

.sprite-box{
    display:flex;
    justify-content:center;
    align-items:center;
    height:220px;
}

.sprite{
    width:200px;
    animation:glitch .15s infinite alternate;
}

@keyframes glitch{
    from{
        transform:translateX(-3px);
    }
    to{
        transform:translateX(3px);
    }
}

.status,
.log{
    border:4px solid #000;
    padding:18px;
}

.status{
    font-size:24px;
}

.hp{
    margin-top:10px;
}

.log{
    font-size:28px;
    min-height:100px;
    display:flex;
    align-items:center;
}

@media(max-width:900px){

    body{
        grid-template-columns:1fr;
    }

    .code{
        font-size:80px;
    }

    .title{
        font-size:32px;
    }

    .desc{
        font-size:16px;
    }

    .menu{
        font-size:18px;
    }

    .sprite{
        width:150px;
    }
}
</style>
</head>

<body>

<div class="left">

    <div class="frame">

        <div class="code">500</div>

        <div class="subtitle">
            INTERNAL SERVER ERROR
        </div>

        <div class="line"></div>

        <div class="title">
            サーバーは<br>
            こんらんしている！
        </div>

        <div class="desc">
            サーバー内部で予期しないエラーが<br>
            発生しました。<br>
            しばらく待ってから再度お試しください。
        </div>

        <div class="command-title">
            ▼ コマンドを選択してください
        </div>

        <div class="menu">
            <span class="cursor">▶</span> リロードする<br>
            ホームへ戻る<br>
            後でもう一度試す
        </div>

    </div>

</div>

<div class="right">

    <div class="sprite-box">

        <svg class="sprite" viewBox="0 0 180 180">

            <!-- アンテナ -->
            <rect x="88" y="10" width="4" height="20" fill="black"/>
            <rect x="80" y="5" width="20" height="4" fill="black"/>

            <!-- 本体 -->
            <rect x="40"
                  y="30"
                  width="100"
                  height="80"
                  fill="white"
                  stroke="black"
                  stroke-width="4"/>

            <!-- バグった目 -->
            <line x1="60" y1="55" x2="75" y2="70"
                  stroke="black"
                  stroke-width="4"/>

            <line x1="75" y1="55" x2="60" y2="70"
                  stroke="black"
                  stroke-width="4"/>

            <line x1="105" y1="55" x2="120" y2="70"
                  stroke="black"
                  stroke-width="4"/>

            <line x1="120" y1="55" x2="105" y2="70"
                  stroke="black"
                  stroke-width="4"/>

            <!-- 口 -->
            <rect x="72"
                  y="82"
                  width="36"
                  height="6"
                  fill="black"/>

            <!-- エラー線 -->
            <rect x="55" y="95" width="20" height="3" fill="black"/>
            <rect x="90" y="95" width="30" height="3" fill="black"/>

            <!-- 土台 -->
            <rect x="75" y="110" width="30" height="15" fill="black"/>
            <rect x="55" y="125" width="70" height="8" fill="black"/>

            <!-- 稲妻 -->
            <polygon points="145,35 130,60 145,60 130,90"
                     fill="black"/>

        </svg>

    </div>

    <div class="status">
        SERVER Lv.99

        <div class="hp">
            HP [----------] 0/9999
        </div>
    </div>

    <div class="log">
        サーバーはこんらんしている！
    </div>

</div>

</body>
</html>
