<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:"Courier New", monospace;
    min-height:100vh;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:20px;
    padding:20px;
}

.left,
.right{
    padding:0;
}

.frame{
    border:4px solid #000;
    padding:25px;
    height:100%;
}

.code{
    font-size:110px;
    font-weight:bold;
    line-height:0.9;
}

.notfound{
    font-size:24px;
    margin-bottom:20px;
}

.line{
    border-top:3px solid #000;
    margin:20px 0 30px;
}

.title{
    font-size:42px;
    line-height:1.4;
    margin-bottom:20px;
}

.desc{
    font-size:18px;
    line-height:1.8;
    margin-bottom:25px;
}

.command-title{
    font-size:20px;
    margin-bottom:10px;
}

.menu{
    border:4px solid #000;
    padding:15px 20px;
    font-size:22px;
    line-height:1.8;
}

.cursor{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.right{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:15px;
}

.sprite-box{
    display:flex;
    justify-content:center;
    align-items:center;
    height:220px;
}

.sprite{
    width:180px;
    animation:run 1s infinite alternate;
}

@keyframes run{
    from{
        transform:translateX(-10px);
    }
    to{
        transform:translateX(10px);
    }
}

.status,
.log{
    border:4px solid #000;
    padding:18px;
}

.status{
    font-size:24px;
}

.hp{
    margin-top:10px;
}

.log{
    font-size:28px;
    min-height:100px;
    display:flex;
    align-items:center;
}

.home-btn{
    display:inline-block;
    margin-top:15px;
    color:#000;
    text-decoration:none;
}

.home-btn:hover{
    text-decoration:underline;
}

@media(max-width:900px){

    body{
        grid-template-columns:1fr;
    }

    .code{
        font-size:80px;
    }

    .title{
        font-size:32px;
    }

    .desc{
        font-size:16px;
    }

    .menu{
        font-size:18px;
    }

    .sprite{
        width:140px;
    }
}
</style>
</head>

<body>

<div class="left">

    <div class="frame">

        <div class="code">404</div>

        <div class="notfound">
            NOT FOUND
        </div>

        <div class="line"></div>

        <div class="title">
            野生のページが<br>
            逃げ出した！
        </div>

        <div class="desc">
            お探しのページは見つかりませんでした。<br>
            もしかすると別の場所へ移動したか、<br>
            存在しないURLかもしれません。
        </div>

        <div class="command-title">
            ▼ コマンドを選択してください
        </div>

        <div class="menu">
            <span class="cursor">▶</span> ホームに戻る<br>
            サイトマップを見る<br>
            前のページに戻る
        </div>

    </div>

</div>

<div class="right">

    <div class="sprite-box">

        <svg class="sprite" viewBox="0 0 180 180">

            <!-- スピード線 -->
            <rect x="0" y="60" width="25" height="4" fill="black"/>
            <rect x="10" y="80" width="35" height="4" fill="black"/>
            <rect x="0" y="100" width="25" height="4" fill="black"/>

            <!-- 足 -->
            <rect x="45" y="125" width="18" height="18" fill="black"/>
            <rect x="117" y="125" width="18" height="18" fill="black"/>

            <rect x="35" y="135" width="18" height="18" fill="black"/>
            <rect x="127" y="135" width="18" height="18" fill="black"/>

            <!-- 本体 -->
            <rect x="45" y="30" width="90" height="95"
                  fill="white"
                  stroke="black"
                  stroke-width="4"/>

            <!-- 折れた角 -->
            <polygon points="110,30 135,55 135,30"
                     fill="#dddddd"
                     stroke="black"
                     stroke-width="4"/>

            <!-- 目 -->
            <rect x="65" y="55" width="8" height="8" fill="black"/>
            <rect x="90" y="55" width="8" height="8" fill="black"/>

            <!-- 口 -->
            <rect x="70" y="80" width="30" height="6" fill="black"/>

            <!-- 紙の文章 -->
            <rect x="65" y="95" width="40" height="3" fill="black"/>
            <rect x="65" y="105" width="30" height="3" fill="black"/>
            <rect x="65" y="115" width="35" height="3" fill="black"/>

        </svg>

    </div>

    <div class="status">
        PAGE Lv. ??
        <div class="hp">
            HP [----------] 0/1
        </div>
    </div>

    <div class="log">
        野生のページは逃げ出した！
    </div>

</div>

</body>
</html>
