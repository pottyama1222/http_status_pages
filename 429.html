<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>429 Too Many Requests</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:"Courier New", monospace;
    min-height:100vh;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:20px;
    padding:20px;
}

.left,
.right{
    padding:0;
}

.frame{
    border:4px solid #000;
    padding:25px;
    height:100%;
}

.code{
    font-size:110px;
    font-weight:bold;
    line-height:0.9;
}

.subtitle{
    font-size:24px;
    margin-bottom:20px;
}

.line{
    border-top:3px solid #000;
    margin:20px 0 30px;
}

.title{
    font-size:42px;
    line-height:1.4;
    margin-bottom:20px;
}

.desc{
    font-size:18px;
    line-height:1.8;
    margin-bottom:25px;
}

.command-title{
    font-size:20px;
    margin-bottom:10px;
}

.menu{
    border:4px solid #000;
    padding:15px 20px;
    font-size:22px;
    line-height:1.8;
}

.cursor{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.right{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:15px;
}

.sprite-box{
    display:flex;
    justify-content:center;
    align-items:center;
    height:220px;
}

.sprite{
    width:200px;
    animation:sleep 2s ease-in-out infinite;
}

@keyframes sleep{
    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(8px);
    }
}

.status,
.log{
    border:4px solid #000;
    padding:18px;
}

.status{
    font-size:24px;
}

.hp{
    margin-top:10px;
}

.log{
    font-size:28px;
    min-height:100px;
    display:flex;
    align-items:center;
}

.zzz{
    animation:floatZ 2s infinite;
    transform-origin:center;
}

@keyframes floatZ{

    0%{
        opacity:0;
        transform:translateY(0);
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-15px);
    }

}

@media(max-width:900px){

    body{
        grid-template-columns:1fr;
    }

    .code{
        font-size:80px;
    }

    .title{
        font-size:32px;
    }

    .desc{
        font-size:16px;
    }

    .menu{
        font-size:18px;
    }

    .sprite{
        width:150px;
    }
}
</style>
</head>

<body>

<div class="left">

    <div class="frame">

        <div class="code">429</div>

        <div class="subtitle">
            TOO MANY REQUESTS
        </div>

        <div class="line"></div>

        <div class="title">
            こうげきしすぎ！
        </div>

        <div class="desc">
            リクエスト回数が上限に達しました。<br>
            サーバーが疲れてしまいました。<br>
            少し時間をおいてから再度お試しください。
        </div>

        <div class="command-title">
            ▼ コマンドを選択してください
        </div>

        <div class="menu">
            <span class="cursor">▶</span> 少し待つ<br>
            ホームへ戻る<br>
            ページを閉じる
        </div>

    </div>

</div>

<div class="right">

    <div class="sprite-box">

        <svg class="sprite" viewBox="0 0 180 180">

            <!-- ZZZ -->

            <text x="120" y="35"
                  font-size="20"
                  class="zzz">
                Z
            </text>

            <text x="140" y="20"
                  font-size="16"
                  class="zzz">
                Z
            </text>

            <!-- 本体 -->

            <rect x="45"
                  y="35"
                  width="90"
                  height="85"
                  fill="white"
                  stroke="black"
                  stroke-width="4"/>

            <!-- ランプ -->

            <circle cx="65"
                    cy="55"
                    r="5"
                    fill="black"/>

            <circle cx="85"
                    cy="55"
                    r="5"
                    fill="black"/>

            <circle cx="105"
                    cy="55"
                    r="5"
                    fill="black"/>

            <!-- 眠そうな目 -->

            <line x1="60" y1="80"
                  x2="75" y2="80"
                  stroke="black"
                  stroke-width="4"/>

            <line x1="105" y1="80"
                  x2="120" y2="80"
                  stroke="black"
                  stroke-width="4"/>

            <!-- 口 -->

            <rect x="78"
                  y="95"
                  width="24"
                  height="4"
                  fill="black"/>

            <!-- 土台 -->

            <rect x="60"
                  y="130"
                  width="60"
                  height="8"
                  fill="black"/>

        </svg>

    </div>

    <div class="status">
        SERVER Lv.50

        <div class="hp">
            HP [█---------] 1/100
        </div>
    </div>

    <div class="log">
        リクエストを送りすぎた！
    </div>

</div>

</body>
</html>
